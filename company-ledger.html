<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司記帳簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F6F3EA;
    --paper-2:#EFEADD;
    --paper-3:#FBFAF5;
    --ink:#1F2A24;
    --ink-soft:#4A5750;
    --muted:#8A8372;
    --line:#DDD5C2;
    --line-strong:#C7BCA2;
    --green:#2F5D50;
    --green-soft:#E4ECE7;
    --rust:#A6472F;
    --rust-soft:#F3E5E0;
    --gold:#B98A3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .serif{font-family:'Source Serif 4',serif;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:232px; flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    padding:28px 18px;
    display:flex; flex-direction:column;
  }
  .brand{margin-bottom:28px; padding:0 6px;}
  .brand .mark{
    width:34px; height:34px; border:1.5px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4',serif; font-weight:600; font-size:16px;
    margin-bottom:10px;
  }
  .brand h1{font-family:'Source Serif 4',serif; font-size:19px; font-weight:600; margin:0 0 2px;}
  .brand p{margin:0; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}

  .shared-badge{
    display:flex; align-items:center; gap:7px; background:var(--paper-3); border:1px solid var(--line);
    border-radius:20px; padding:6px 12px 6px 10px; font-size:11.5px; color:var(--ink-soft); margin-bottom:22px;
  }
  .shared-badge .pulse{width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0;}

  nav{display:flex; flex-direction:column; gap:2px;}
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    text-align:left; background:none; border:none; cursor:pointer;
    padding:10px 10px; border-radius:5px;
    font-size:14px; color:var(--ink-soft); font-weight:500;
    border-left:2px solid transparent;
  }
  .nav-btn .num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); width:16px;}
  .nav-btn:hover{background:var(--paper-3);}
  .nav-btn.active{background:var(--paper-3); border-left:2px solid var(--gold); color:var(--ink); font-weight:600;}
  .nav-btn:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}

  .sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); line-height:1.5;}

  .main{flex:1; padding:36px 44px 60px; max-width:1220px;}
  .page-head{margin-bottom:26px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-head .eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px;}
  .page-head h2{font-family:'Source Serif 4',serif; font-size:28px; font-weight:600; margin:0;}
  .page-head .sub{font-size:12.5px; color:var(--muted); margin:8px 0 0;}

  .hero{
    background:var(--paper-3); border:1px solid var(--line); border-radius:8px;
    padding:30px 34px; margin-bottom:22px;
  }
  .hero .eyebrow{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 10px;}
  .hero .net{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:44px;
    letter-spacing:-.01em; color:var(--ink); line-height:1.1;
  }
  .hero .net-line{
    margin-top:10px; height:0; border-bottom:2px solid var(--ink); position:relative; width:260px;
  }
  .hero .net-line::after{
    content:''; position:absolute; left:0; right:0; bottom:-5px; border-bottom:1px solid var(--ink);
  }
  .hero .net-label{margin-top:14px; font-size:13px; color:var(--muted);}

  .stat-row{display:flex; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
  .stat-card{
    flex:1; min-width:200px;
    background:var(--paper-3); border:1px solid var(--line); border-radius:8px; padding:18px 20px;
  }
  .stat-card .label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  .stat-card .value{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:24px;}
  .stat-card.income .value{color:var(--green);}
  .stat-card.expense .value{color:var(--rust);}

  .panel{background:var(--paper-3); border:1px solid var(--line); border-radius:8px; padding:24px 26px; margin-bottom:22px;}
  .panel h3{font-family:'Source Serif 4',serif; font-size:16px; font-weight:600; margin:0 0 18px;}
  .legend{display:flex; gap:18px; margin-bottom:16px; font-size:12px; color:var(--ink-soft);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot.income{background:var(--green);}
  .dot.expense{background:var(--rust);}

  .chart{display:flex; align-items:flex-end; gap:10px; height:170px; border-bottom:1px solid var(--line-strong); padding-bottom:0;}
  .chart-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:0;}
  .bars{display:flex; align-items:flex-end; gap:3px; height:150px; width:100%; justify-content:center;}
  .bar{width:11px; border-radius:2px 2px 0 0; min-height:2px;}
  .bar.income{background:var(--green);}
  .bar.expense{background:var(--rust);}
  .chart-col .m-label{margin-top:8px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--muted);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; justify-content:space-between;}
  .filters{display:flex; gap:10px; flex-wrap:wrap;}
  .field-sm{display:flex; flex-direction:column; gap:4px;}
  .field-sm label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  select, .textinput{
    background:var(--paper-3); border:1px solid var(--line-strong); border-radius:5px;
    padding:7px 10px; font-size:13px; color:var(--ink); min-width:140px;
  }
  select:focus, .textinput:focus{outline:2px solid var(--gold); outline-offset:0;}

  .btn{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper-3);
    border-radius:5px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn:hover{opacity:.88;}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong); font-weight:500;}
  .btn.ghost:hover{background:var(--paper-2);}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:4px;}
  .btn.danger{border-color:var(--rust); color:var(--rust); background:transparent;}
  .btn.danger:hover{background:var(--rust-soft);}
  .btn.gold{border-color:var(--gold); background:var(--gold); color:var(--paper-3);}
  .btn.gold:hover{opacity:.9;}

  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
  }
  tbody td{padding:12px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tbody tr:hover{background:var(--paper-2);}
  td.amount{font-family:'IBM Plex Mono',monospace; text-align:right; font-weight:600; white-space:nowrap;}
  td.amount.income{color:var(--green);}
  td.amount.expense{color:var(--rust);}
  th.amount-h{text-align:right;}
  td.actions{text-align:right; white-space:nowrap;}
  td.actions .btn{margin-left:6px;}
  .badge{
    font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; letter-spacing:.02em;
  }
  .badge.yes{background:var(--green-soft); color:var(--green);}
  .badge.no{background:var(--rust-soft); color:var(--rust);}
  .cat-tag{font-size:12px; background:var(--paper-2); border:1px solid var(--line); padding:3px 9px; border-radius:20px;}
  .empty-row td{text-align:center; color:var(--muted); padding:36px 10px; font-size:13px;}
  .clip-btn{display:inline-flex; align-items:center; gap:5px;}
  .payer-tag{font-size:11.5px; white-space:nowrap;}
  .payer-tag.company{color:var(--ink-soft);}
  .payer-tag.employee{color:var(--gold); font-weight:600;}

  .cat-cols{display:flex; gap:20px; flex-wrap:wrap;}
  .cat-col{flex:1; min-width:260px;}
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 16px;}
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--paper-2); border:1px solid var(--line);
    padding:6px 8px 6px 12px; border-radius:20px; font-size:13px;
  }
  .chip button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; line-height:1; padding:2px;}
  .chip button:hover{color:var(--rust);}
  .add-cat{display:flex; gap:8px;}
  .add-cat input{flex:1;}

  .overlay{
    position:fixed; inset:0; background:rgba(31,42,36,.35); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-3); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:460px; padding:26px 26px 22px; max-height:90vh; overflow-y:auto;
  }
  .modal h3{font-family:'Source Serif 4',serif; font-size:18px; margin:0 0 18px;}
  .form-row{margin-bottom:14px; display:flex; flex-direction:column; gap:5px;}
  .form-row label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .form-row input, .form-row select, .form-row textarea{
    width:100%; background:var(--paper); border:1px solid var(--line-strong); border-radius:5px;
    padding:9px 10px; font-size:13.5px; color:var(--ink);
  }
  .form-row textarea{resize:vertical; min-height:56px;}
  .form-row .hint{font-size:11px; color:var(--muted); margin:2px 0 0;}
  .form-2col{display:flex; gap:10px;}
  .form-2col .form-row{flex:1;}
  .form-check{display:flex; align-items:center; gap:8px; flex-direction:row;}
  .form-check input{width:auto;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .form-err{font-size:12px; color:var(--rust); margin-top:-8px; margin-bottom:10px; display:none;}

  .attach-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .attach-item{
    display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px;
  }
  .attach-icon{
    width:30px; height:30px; border-radius:5px; background:var(--paper-2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; overflow:hidden;
  }
  .attach-icon img{width:100%; height:100%; object-fit:cover;}
  .attach-meta{flex:1; min-width:0;}
  .attach-name{font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .attach-size{font-size:11px; color:var(--muted);}
  .attach-actions{display:flex; gap:4px; flex-shrink:0;}
  .attach-actions a, .attach-actions button{
    font-size:11.5px; padding:4px 8px; border-radius:4px; border:1px solid var(--line-strong);
    background:var(--paper-3); color:var(--ink-soft); text-decoration:none; cursor:pointer;
  }
  .attach-actions button.del{color:var(--rust); border-color:var(--rust-soft);}
  .attach-empty{font-size:12px; color:var(--muted); padding:6px 0;}
  .view-modal .attach-item{background:var(--paper-3);}

  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-size:14px;}

  @media (max-width: 760px){
    .app{flex-direction:column;}
    .sidebar{width:100%; padding:16px; flex-direction:row; align-items:center; gap:16px; overflow-x:auto;}
    .brand{margin-bottom:0; white-space:nowrap;}
    .shared-badge{margin-bottom:0; white-space:nowrap;}
    nav{flex-direction:row;}
    .sidebar-foot{display:none;}
    .main{padding:22px 18px 50px;}
    .hero .net{font-size:32px;}
    .stat-row{flex-direction:column;}
    .form-2col{flex-direction:column;}
  }
</style>
</head>
<body>
<div id="root" class="loading-screen">載入資料中…</div>

<script>
const K_INCOME = 'ledger:income';
const K_EXPENSE = 'ledger:expense';
const K_CATS = 'ledger:categories';
const SHARED = true;
const MAX_FILE_SIZE = 3 * 1024 * 1024;

async function storageGet(key, fallback){
  try{
    const r = await window.storage.get(key, SHARED);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){
    return fallback;
  }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), SHARED); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function attachSave(id, dataUrl){
  try{ await window.storage.set('attach:'+id, dataUrl, SHARED); return true; }
  catch(e){ console.error('attach save failed', e); return false; }
}
async function attachLoad(id){
  try{ const r = await window.storage.get('attach:'+id, SHARED); return r ? r.value : null; }
  catch(e){ return null; }
}
async function attachDelete(id){
  try{ await window.storage.delete('attach:'+id, SHARED); }catch(e){ }
}

const state = {
  income: [],
  expense: [],
  categories: { income: [], expense: [], employees: [] },
  page: 'dashboard',
  filters: {
    income: { category:'', from:'', to:'' },
    expense: { category:'', from:'', to:'', receipt:'' }
  }
};

const DEFAULT_CATS = {
  income: ['銷售收入','服務收入','利息收入','其他收入'],
  expense: ['薪資','租金','水電雜費','辦公用品','行銷費用','差旅費','其他支出'],
  employees: []
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function fmtMoney(n){
  const v = Number(n)||0;
  return 'NT$ ' + v.toLocaleString('zh-Hant-TW', {maximumFractionDigits:0});
}
function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  return parts[0]+'/'+parts[1]+'/'+parts[2];
}
function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

async function init(){
  const [inc, exp, cats] = await Promise.all([
    storageGet(K_INCOME, []),
    storageGet(K_EXPENSE, []),
    storageGet(K_CATS, null)
  ]);
  state.income = inc;
  state.expense = exp;
  state.categories = cats || JSON.parse(JSON.stringify(DEFAULT_CATS));
  if(!state.categories.employees) state.categories.employees = [];
  if(!cats) await storageSet(K_CATS, state.categories);
  renderApp();
}

function renderApp(){
  const root = document.getElementById('root');
  root.className = '';
  root.innerHTML =
    '<div class="app">' +
      '<div class="sidebar">' +
        '<div class="brand">' +
          '<div class="mark">帳</div>' +
          '<h1>公司記帳簿</h1>' +
          '<p>Company Ledger</p>' +
        '</div>' +
        '<div class="shared-badge"><span class="pulse"></span>公司共用模式・團隊共同記帳</div>' +
        '<nav>' +
          navBtn('dashboard','01','總覽 Dashboard') +
          navBtn('income','02','收入紀錄') +
          navBtn('expense','03','支出紀錄') +
          navBtn('categories','04','類別設定') +
        '</nav>' +
        '<div class="sidebar-foot">所有帳目與已上傳憑證由團隊成員共用,任何人開啟此工具皆會看到相同資料。</div>' +
      '</div>' +
      '<div class="main" id="main"></div>' +
    '</div>' +
    '<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>';
  renderPage();
}
function navBtn(key, num, label){
  return '<button class="nav-btn ' + (state.page===key?'active':'') + '" onclick="goPage(\'' + key + '\')"><span class="num">' + num + '</span>' + label + '</button>';
}
function goPage(key){ state.page = key; renderApp(); }

function renderPage(){
  const main = document.getElementById('main');
  if(state.page==='dashboard') main.innerHTML = pageDashboard();
  else if(state.page==='income') main.innerHTML = pageRecords('income');
  else if(state.page==='expense') main.innerHTML = pageRecords('expense');
  else if(state.page==='categories') main.innerHTML = pageCategories();
}

function pageDashboard(){
  const now = new Date();
  const year = now.getFullYear();
  const curMonth = now.getMonth()+1;

  const incYear = state.income.filter(r=> new Date(r.date).getFullYear()===year);
  const expYear = state.expense.filter(r=> new Date(r.date).getFullYear()===year);
  const totalInc = incYear.reduce((s,r)=>s+Number(r.amount||0),0);
  const totalExp = expYear.reduce((s,r)=>s+Number(r.amount||0),0);
  const net = totalInc - totalExp;

  const monthly = [];
  for(let m=1; m<=curMonth; m++){
    const mi = incYear.filter(r=> (new Date(r.date).getMonth()+1)===m).reduce((s,r)=>s+Number(r.amount||0),0);
    const me = expYear.filter(r=> (new Date(r.date).getMonth()+1)===m).reduce((s,r)=>s+Number(r.amount||0),0);
    monthly.push({m:m, mi:mi, me:me});
  }
  const maxVal = Math.max(1, ...monthly.map(x=>Math.max(x.mi,x.me)));

  const chartCols = monthly.map(x=>
    '<div class="chart-col"><div class="bars">' +
      '<div class="bar income" style="height:'+Math.max(2,(x.mi/maxVal)*150)+'px" title="收入 '+fmtMoney(x.mi)+'"></div>' +
      '<div class="bar expense" style="height:'+Math.max(2,(x.me/maxVal)*150)+'px" title="支出 '+fmtMoney(x.me)+'"></div>' +
    '</div><div class="m-label">'+x.m+'月</div></div>'
  ).join('');

  const recent = [...state.income.map(r=>Object.assign({},r,{_type:'income'})), ...state.expense.map(r=>Object.assign({},r,{_type:'expense'}))]
    .sort((a,b)=> b.date.localeCompare(a.date))
    .slice(0,8);

  const recentRows = recent.length ? recent.map(r=>
    '<tr><td class="mono">'+fmtDate(r.date)+'</td><td><span class="cat-tag">'+escapeHtml(r.category)+'</span></td><td>'+escapeHtml(r.item)+'</td>' +
    '<td class="amount '+r._type+'">'+(r._type==='income'?'+':'−')+' '+fmtMoney(r.amount)+'</td></tr>'
  ).join('') : '<tr class="empty-row"><td colspan="4">尚無任何紀錄,前往「收入紀錄」或「支出紀錄」開始新增。</td></tr>';

  return (
    '<div class="page-head"><div><p class="eyebrow">Overview · '+year+'</p><h2>年度總覽</h2>' +
    '<p class="sub">此帳本為公司共用,所有團隊成員看到的是同一份收支資料與憑證附件。</p></div>' +
    '<button class="btn gold" onclick="exportAll()">⬇ 匯出完整報表（Excel）</button></div>' +
    '<div class="hero"><p class="eyebrow">本年度淨額（1月–'+curMonth+'月）</p>' +
    '<div class="net mono" style="color:'+(net>=0?'var(--green)':'var(--rust)')+'">'+fmtMoney(net)+'</div>' +
    '<div class="net-line"></div></div>' +
    '<div class="stat-row">' +
      '<div class="stat-card income"><div class="label">年度累計總收入</div><div class="value mono">'+fmtMoney(totalInc)+'</div></div>' +
      '<div class="stat-card expense"><div class="label">年度累計總支出</div><div class="value mono">'+fmtMoney(totalExp)+'</div></div>' +
    '</div>' +
    '<div class="panel"><h3>月別收支（'+year+'年）</h3>' +
    '<div class="legend"><span><i class="dot income"></i>收入</span><span><i class="dot expense"></i>支出</span></div>' +
    '<div class="chart">'+chartCols+'</div></div>' +
    '<div class="panel"><h3>最近紀錄</h3><table><thead><tr><th>日期</th><th>類別</th><th>項目</th><th class="amount-h">金額</th></tr></thead>' +
    '<tbody>'+recentRows+'</tbody></table></div>'
  );
}

function pageRecords(type){
  const isIncome = type==='income';
  const list = state[type];
  const cats = state.categories[type];
  const f = state.filters[type];

  let filtered = list.filter(r=>{
    if(f.category && r.category!==f.category) return false;
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    if(!isIncome && f.receipt==='yes' && !r.hasReceipt) return false;
    if(!isIncome && f.receipt==='no' && r.hasReceipt) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  const sum = filtered.reduce((s,r)=>s+Number(r.amount||0),0);

  const catOptions = cats.map(c=>'<option value="'+escapeAttr(c)+'" '+(f.category===c?'selected':'')+'>'+escapeHtml(c)+'</option>').join('');

  const rows = filtered.length ? filtered.map(r=>{
    const attachCount = (r.attachments||[]).length;
    const attachCell = attachCount ? ('<button class="btn ghost small clip-btn" onclick="viewAttachments(\''+type+'\',\''+r.id+'\')">📎 '+attachCount+'</button>') : '<span style="color:var(--muted); font-size:12px;">—</span>';

    let midCols;
    if(isIncome){
      midCols =
        '<td>'+escapeHtml(r.payer||'—')+'</td>' +
        '<td class="mono" style="font-size:12px;">'+escapeHtml(r.invoiceNo||'—')+'</td>' +
        '<td class="mono" style="font-size:12px;">'+(r.receivableDate?fmtDate(r.receivableDate):'—')+'</td>' +
        '<td class="mono" style="font-size:12px;">'+(r.bookingDate?fmtDate(r.bookingDate):'—')+'</td>';
    }else{
      const payerLabel = r.payerType==='employee'
        ? ('<span class="payer-tag employee">員工代墊・'+escapeHtml(r.employeeName||'未指定')+'</span>')
        : ('<span class="payer-tag company">公司帳戶支出</span>');
      midCols =
        '<td>'+payerLabel+'</td>' +
        '<td>'+(r.hasReceipt?'<span class="badge yes">有收據</span>':'<span class="badge no">無收據</span>')+'</td>';
    }

    return (
      '<tr><td class="mono">'+fmtDate(r.date)+'</td><td><span class="cat-tag">'+escapeHtml(r.category)+'</span></td><td>'+escapeHtml(r.item)+'</td>' +
      midCols +
      '<td>'+escapeHtml(r.note||'—')+'</td>' +
      '<td>'+attachCell+'</td>' +
      '<td class="amount '+type+'">'+fmtMoney(r.amount)+'</td>' +
      '<td class="actions"><button class="btn ghost small" onclick="openRecordForm(\''+type+'\',\''+r.id+'\')">編輯</button>' +
      '<button class="btn danger small" onclick="deleteRecord(\''+type+'\',\''+r.id+'\')">刪除</button></td></tr>'
    );
  }).join('') : '<tr class="empty-row"><td colspan="10">找不到符合篩選條件的紀錄。</td></tr>';

  const receiptFilter = !isIncome ? (
    '<div class="field-sm"><label>收據</label><select onchange="setFilter(\'expense\',\'receipt\',this.value)">' +
    '<option value="">全部</option><option value="yes" '+(f.receipt==='yes'?'selected':'')+'>有收據</option>' +
    '<option value="no" '+(f.receipt==='no'?'selected':'')+'>無收據</option></select></div>'
  ) : '';

  const headMid = isIncome
    ? '<th>付款單位</th><th>發票號碼</th><th>應收款日期</th><th>入帳日期</th>'
    : '<th>支出者</th><th>收據</th>';

  return (
    '<div class="page-head"><div><p class="eyebrow">'+(isIncome?'Income':'Expense')+' Records</p><h2>'+(isIncome?'收入紀錄':'支出紀錄')+'</h2></div></div>' +
    '<div class="toolbar"><div class="filters">' +
      '<div class="field-sm"><label>類別</label><select onchange="setFilter(\''+type+'\',\'category\',this.value)"><option value="">全部</option>'+catOptions+'</select></div>' +
      '<div class="field-sm"><label>起始日期</label><input type="date" class="textinput" value="'+f.from+'" onchange="setFilter(\''+type+'\',\'from\',this.value)"></div>' +
      '<div class="field-sm"><label>結束日期</label><input type="date" class="textinput" value="'+f.to+'" onchange="setFilter(\''+type+'\',\'to\',this.value)"></div>' +
      receiptFilter +
    '</div><div style="display:flex; gap:8px;">' +
      '<button class="btn gold" onclick="exportRecords(\''+type+'\')">⬇ 匯出 Excel</button>' +
      '<button class="btn" onclick="openRecordForm(\''+type+'\')">＋ 新增'+(isIncome?'收入':'支出')+'</button>' +
    '</div></div>' +
    '<div class="panel" style="padding:0; overflow-x:auto;"><table style="min-width:'+(isIncome?'1180px':'980px')+';"><thead><tr><th>日期</th><th>類別</th><th>項目</th>' +
    headMid +
    '<th>備註</th><th>附件</th><th class="amount-h">金額</th><th></th></tr></thead><tbody>'+rows+'</tbody>' +
    (filtered.length ? ('<tfoot><tr><td colspan="'+(isIncome?8:6)+'" style="text-align:right; font-size:12px; color:var(--muted); padding:10px;">小計</td><td class="amount '+type+'" style="padding:10px;">'+fmtMoney(sum)+'</td><td></td></tr></tfoot>') : '') +
    '</table></div>'
  );
}

function setFilter(type, key, value){
  state.filters[type][key] = value;
  renderPage();
}

let formState = null;

function openRecordForm(type, id){
  const isIncome = type==='income';
  const record = id ? state[type].find(r=>r.id===id) : null;
  const cats = state.categories[type];

  if(cats.length===0){
    alert('請先至「類別設定」新增至少一個' + (isIncome?'收入':'支出') + '類別。');
    return;
  }

  formState = {
    type: type, recordId: id || null,
    attachments: record ? JSON.parse(JSON.stringify(record.attachments||[])) : [],
    newlyUploadedIds: [],
    cache: {}
  };

  const today = new Date().toISOString().slice(0,10);
  const d = record || { category: cats[0], item:'', date: today, payer:'', invoiceNo:'', receivableDate:'', bookingDate:'', amount:'', note:'', hasReceipt:false, payerType:'company', employeeName:'' };

  const catOptions = cats.map(c=>'<option value="'+escapeAttr(c)+'" '+(d.category===c?'selected':'')+'>'+escapeHtml(c)+'</option>').join('');

  let extraRows = '';
  if(isIncome){
    extraRows =
      '<div class="form-row"><label>付款單位</label><input id="f_payer" type="text" value="'+escapeAttr(d.payer||'')+'" placeholder="例：某某股份有限公司"></div>' +
      '<div class="form-row"><label>發票號碼</label><input id="f_invoice" type="text" value="'+escapeAttr(d.invoiceNo||'')+'" placeholder="例：AB12345678"></div>' +
      '<div class="form-2col">' +
        '<div class="form-row"><label>應收款日期</label><input id="f_receivable" type="date" value="'+(d.receivableDate||'')+'"></div>' +
        '<div class="form-row"><label>入帳日期</label><input id="f_booking" type="date" value="'+(d.bookingDate||'')+'"></div>' +
      '</div>';
  }else{
    const employees = state.categories.employees || [];
    const empOptions = employees.map(e=>'<option value="'+escapeAttr(e)+'" '+(d.employeeName===e?'selected':'')+'>'+escapeHtml(e)+'</option>').join('');
    extraRows =
      '<div class="form-row"><label>支出者</label><select id="f_payertype" onchange="togglePayerType()">' +
        '<option value="company" '+(d.payerType!=='employee'?'selected':'')+'>由公司帳戶支出</option>' +
        '<option value="employee" '+(d.payerType==='employee'?'selected':'')+'>員工代墊</option>' +
      '</select></div>' +
      '<div class="form-row" id="employeeRow" style="display:'+(d.payerType==='employee'?'flex':'none')+';">' +
        '<label>員工姓名</label><select id="f_employee">'+empOptions+'</select>' +
        (employees.length===0 ? '<p class="hint">尚未設定任何員工,請先至「類別設定」新增員工姓名。</p>' : '') +
      '</div>' +
      '<div class="form-row form-check"><input id="f_receipt" type="checkbox" '+(d.hasReceipt?'checked':'')+'><label style="margin:0;">是否有收據</label></div>';
  }

  const body =
    '<h3>'+(record?'編輯':'新增')+(isIncome?'收入':'支出')+'紀錄</h3>' +
    '<div class="form-row"><label>類別</label><select id="f_category">'+catOptions+'</select></div>' +
    '<div class="form-row"><label>項目</label><input id="f_item" type="text" value="'+escapeAttr(d.item)+'" placeholder="例：七月份顧問服務"></div>' +
    '<div class="form-row"><label>日期</label><input id="f_date" type="date" value="'+d.date+'"></div>' +
    extraRows +
    '<div class="form-row"><label>金額（NT$）</label><input id="f_amount" type="number" min="0" step="1" value="'+d.amount+'"></div>' +
    '<div class="form-row"><label>備註</label><textarea id="f_note">'+escapeHtml(d.note||'')+'</textarea></div>' +
    '<div class="form-row"><label>憑證上傳</label>' +
    '<input id="f_file" type="file" accept="image/*,application/pdf" multiple onchange="handleFileUpload(event)">' +
    '<p class="hint">支援圖片或 PDF,單檔上限 3MB,可上傳多個檔案供會計歸檔。</p>' +
    '<div class="attach-list" id="attachList"></div></div>' +
    '<p class="form-err" id="f_err">請填寫項目、日期與金額（金額需大於等於 0）。</p>' +
    '<div class="modal-actions"><button class="btn ghost" onclick="cancelRecordForm()">取消</button>' +
    '<button class="btn" onclick="submitRecordForm(\''+type+'\', '+(record? ("'"+record.id+"'") : 'null')+')">'+(record?'儲存變更':'新增紀錄')+'</button></div>';

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('overlay').classList.add('open');
  renderAttachmentList();
}

function togglePayerType(){
  const val = document.getElementById('f_payertype').value;
  const row = document.getElementById('employeeRow');
  if(val==='employee'){
    if((state.categories.employees||[]).length===0){
      alert('尚未設定任何員工姓名,請先至「類別設定」新增員工,才能選擇員工代墊。');
      document.getElementById('f_payertype').value = 'company';
      row.style.display = 'none';
      return;
    }
    row.style.display = 'flex';
  }else{
    row.style.display = 'none';
  }
}

function renderAttachmentList(){
  const el = document.getElementById('attachList');
  if(!el || !formState) return;
  const items = formState.attachments;
  if(!items.length){
    el.innerHTML = '<p class="attach-empty">尚未上傳任何憑證。</p>';
    return;
  }
  el.innerHTML = items.map(a=>{
    const isImage = a.mimeType && a.mimeType.indexOf('image/')===0;
    const cached = formState.cache[a.id];
    const iconHtml = (isImage && cached) ? ('<img src="'+cached+'">') : (isImage ? '🖼️' : '📄');
    return (
      '<div class="attach-item" id="att_'+a.id+'">' +
        '<div class="attach-icon">'+iconHtml+'</div>' +
        '<div class="attach-meta"><div class="attach-name">'+escapeHtml(a.filename)+'</div><div class="attach-size">'+fmtSize(a.size)+'</div></div>' +
        '<div class="attach-actions"><a href="#" onclick="downloadAttachment(\''+a.id+'\',\''+escapeAttr(a.filename)+'\'); return false;">下載</a>' +
        '<button class="del" onclick="removeAttachment(\''+a.id+'\')">刪除</button></div>' +
      '</div>'
    );
  }).join('');

  items.filter(a=>a.mimeType && a.mimeType.indexOf('image/')===0 && !formState.cache[a.id]).forEach(async (a)=>{
    const data = await attachLoad(a.id);
    if(data && formState){
      formState.cache[a.id] = data;
      const iconEl = document.querySelector('#att_'+CSS.escape(a.id)+' .attach-icon');
      if(iconEl) iconEl.innerHTML = '<img src="'+data+'">';
    }
  });
}

async function handleFileUpload(event){
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  for(const file of files){
    if(file.size > MAX_FILE_SIZE){
      alert('「'+file.name+'」檔案過大（上限 3MB），請壓縮後再上傳。');
      continue;
    }
    const dataUrl = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    }).catch(()=>null);
    if(!dataUrl) continue;

    const id = uid();
    const ok = await attachSave(id, dataUrl);
    if(!ok){
      alert('「'+file.name+'」上傳失敗,請稍後再試。');
      continue;
    }
    formState.cache[id] = dataUrl;
    formState.newlyUploadedIds.push(id);
    formState.attachments.push({ id: id, filename: file.name, mimeType: file.type || 'application/octet-stream', size: file.size });
  }
  renderAttachmentList();
}

async function downloadAttachment(id, filename){
  let dataUrl = formState && formState.cache[id];
  if(!dataUrl) dataUrl = await attachLoad(id);
  if(!dataUrl){ alert('找不到此檔案,可能已被刪除。'); return; }
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename || 'attachment';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function removeAttachment(id){
  if(!confirm('確定要刪除這個附件嗎？此動作無法復原。')) return;
  await attachDelete(id);
  formState.attachments = formState.attachments.filter(a=>a.id!==id);
  formState.newlyUploadedIds = formState.newlyUploadedIds.filter(x=>x!==id);
  delete formState.cache[id];

  if(formState.recordId){
    const rec = state[formState.type].find(r=>r.id===formState.recordId);
    if(rec){
      rec.attachments = formState.attachments;
      await storageSet(formState.type==='income'?K_INCOME:K_EXPENSE, state[formState.type]);
    }
  }
  renderAttachmentList();
}

async function cancelRecordForm(){
  if(formState && formState.newlyUploadedIds.length){
    for(const id of formState.newlyUploadedIds){
      await attachDelete(id);
    }
  }
  formState = null;
  closeModal();
}

async function submitRecordForm(type, id){
  const isIncome = type==='income';
  const category = document.getElementById('f_category').value;
  const item = document.getElementById('f_item').value.trim();
  const date = document.getElementById('f_date').value;
  const amount = document.getElementById('f_amount').value;
  const note = document.getElementById('f_note').value.trim();

  let extra = {};
  if(isIncome){
    extra = {
      payer: document.getElementById('f_payer').value.trim(),
      invoiceNo: document.getElementById('f_invoice').value.trim(),
      receivableDate: document.getElementById('f_receivable').value || '',
      bookingDate: document.getElementById('f_booking').value || ''
    };
  }else{
    const payerType = document.getElementById('f_payertype').value;
    const employeeName = payerType==='employee' ? document.getElementById('f_employee').value : '';
    extra = {
      payerType: payerType,
      employeeName: employeeName,
      hasReceipt: document.getElementById('f_receipt').checked
    };
  }

  if(!item || !date || amount===''  || Number(amount) < 0){
    document.getElementById('f_err').style.display = 'block';
    return;
  }

  const attachments = formState ? formState.attachments : [];
  const list = state[type];
  if(id){
    const rec = list.find(r=>r.id===id);
    Object.assign(rec, { category:category, item:item, date:date, amount: Number(amount), note:note, attachments:attachments }, extra);
  }else{
    const newRec = Object.assign({ id: uid(), category:category, item:item, date:date, amount: Number(amount), note:note, attachments:attachments }, extra);
    list.push(newRec);
  }
  await storageSet(isIncome?K_INCOME:K_EXPENSE, list);
  formState = null;
  closeModal();
  renderPage();
}

async function deleteRecord(type, id){
  if(!confirm('確定要刪除這筆紀錄嗎？相關已上傳的憑證也會一併刪除,此動作無法復原。')) return;
  const rec = state[type].find(r=>r.id===id);
  if(rec && rec.attachments && rec.attachments.length){
    for(const a of rec.attachments){ await attachDelete(a.id); }
  }
  state[type] = state[type].filter(r=>r.id!==id);
  await storageSet(type==='income'?K_INCOME:K_EXPENSE, state[type]);
  renderPage();
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
}

      '<div class="attach-icon">'+(a.mimeType && a.mimeType.indexOf('image/')===0 ? '🖼️' : '📄')+'</div>' +

  ).join('') : '<p class="attach-empty">此筆紀錄尚無附件。</p>';

      '<button class="btn small" onclick="addCategory(\'employees\')">新增</button></div></div>' +

async function addCategory(type){
  const inputId = type==='income' ? 'newIncCat' : (type==='expense' ? 'newExpCat' : 'newEmpCat');
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  if(!state.categories[type]) state.categories[type] = [];
  if(state.categories[type].includes(val)){ input.value=''; return; }
  state.categories[type].push(val);
  await storageSet(K_CATS, state.categories);
  renderPage();
}

async function deleteCategory(type, name){
  let inUse = false;
  if(type==='income') inUse = state.income.some(r=>r.category===name);
  else if(type==='expense') inUse = state.expense.some(r=>r.category===name);
  else if(type==='employees') inUse = state.expense.some(r=>r.employeeName===name);

  const msg = type==='employees'
    ? ('已有支出紀錄代墊員工為「'+name+'」,刪除後這些紀錄仍會保留原姓名文字。確定要刪除嗎？')
    : ('已有紀錄使用「'+name+'」這個類別,刪除後這些紀錄仍會保留原類別文字。確定要刪除嗎？');

  if(inUse && !confirm(msg)) return;
  state.categories[type] = state.categories[type].filter(c=>c!==name);
  await storageSet(K_CATS, state.categories);
  renderPage();
}

/* ===================== Excel export ===================== */
function ensureXlsx(){
  if(typeof XLSX === 'undefined'){
    alert('Excel 匯出功能仍在載入中,請稍候幾秒後再試一次。');
    return false;
  }
  return true;
}

function exportRecords(type){
  if(!ensureXlsx()) return;
  const isIncome = type==='income';
  const f = state.filters[type];
  const list = state[type].filter(r=>{
    if(f.category && r.category!==f.category) return false;
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    if(!isIncome && f.receipt==='yes' && !r.hasReceipt) return false;
    if(!isIncome && f.receipt==='no' && r.hasReceipt) return false;
    return true;
  }).sort((a,b)=> a.date.localeCompare(b.date));

  const rows = list.map(r=> isIncome ? {
    '日期': fmtDate(r.date),
    '類別': r.category,
    '項目': r.item,
    '付款單位': r.payer||'',
    '發票號碼': r.invoiceNo||'',
    '應收款日期': r.receivableDate ? fmtDate(r.receivableDate) : '',
    '入帳日期': r.bookingDate ? fmtDate(r.bookingDate) : '',
    '金額': Number(r.amount)||0,
    '備註': r.note||'',
    '附件數': (r.attachments||[]).length
  } : {
    '日期': fmtDate(r.date),
    '類別': r.category,
    '項目': r.item,
    '支出者': r.payerType==='employee' ? '員工代墊' : '公司帳戶支出',
    '代墊員工': r.payerType==='employee' ? (r.employeeName||'') : '',
    '是否有收據': r.hasReceipt ? '有' : '無',
    '金額': Number(r.amount)||0,
    '備註': r.note||'',
    '附件數': (r.attachments||[]).length
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, isIncome ? '收入紀錄' : '支出紀錄');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, (isIncome?'收入紀錄_':'支出紀錄_')+stamp+'.xlsx');
}

function exportAll(){
  if(!ensureXlsx()) return;
  const wb = XLSX.utils.book_new();

  const incRows = [...state.income].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({
    '日期': fmtDate(r.date), '類別': r.category, '項目': r.item, '付款單位': r.payer||'',
    '發票號碼': r.invoiceNo||'', '應收款日期': r.receivableDate?fmtDate(r.receivableDate):'',
    '入帳日期': r.bookingDate?fmtDate(r.bookingDate):'', '金額': Number(r.amount)||0,
    '備註': r.note||'', '附件數': (r.attachments||[]).length
  }));
  const expRows = [...state.expense].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({
    '日期': fmtDate(r.date), '類別': r.category, '項目': r.item,
    '支出者': r.payerType==='employee' ? '員工代墊' : '公司帳戶支出',
    '代墊員工': r.payerType==='employee' ? (r.employeeName||'') : '',
    '是否有收據': r.hasReceipt ? '有' : '無', '金額': Number(r.amount)||0,
    '備註': r.note||'', '附件數': (r.attachments||[]).length
  }));

  const now = new Date();
  const year = now.getFullYear();
  const summaryRows = [];
  for(let m=1; m<=12; m++){
    const mi = state.income.filter(r=>{ const dt=new Date(r.date); return dt.getFullYear()===year && (dt.getMonth()+1)===m; }).reduce((s,r)=>s+Number(r.amount||0),0);
    const me = state.expense.filter(r=>{ const dt=new Date(r.date); return dt.getFullYear()===year && (dt.getMonth()+1)===m; }).reduce((s,r)=>s+Number(r.amount||0),0);
    summaryRows.push({'月份': m+'月', '收入': mi, '支出': me, '淨額': mi-me});
  }
  const totalInc = summaryRows.reduce((s,r)=>s+r['收入'],0);
  const totalExp = summaryRows.reduce((s,r)=>s+r['支出'],0);
  summaryRows.push({'月份':'年度合計', '收入': totalInc, '支出': totalExp, '淨額': totalInc-totalExp});

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), year+'年總覽');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incRows), '收入紀錄');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expRows), '支出紀錄');

  const stamp = now.toISOString().slice(0,10);
  XLSX.writeFile(wb, '公司記帳簿_'+stamp+'.xlsx');
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}
function escapeAttr(str){ return escapeHtml(str); }

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    if(document.getElementById('overlay').classList.contains('open')){
      if(formState && formState.newlyUploadedIds && formState.newlyUploadedIds.length){
        cancelRecordForm();
      }else{
        formState = null;
        closeModal();
      }
    }
  }
});

init();
</script>
